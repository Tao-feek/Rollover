<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rollover">
<title>Bet Rollover Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mute:#667085;--line:#e3e6eb;--acc:#1f7a4d;--win:#1f7a4d;--loss:#c0392b;--pend:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1b2027;--tx:#eef1f5;--mute:#98a2b3;--line:#2b323c;--acc:#3ecf8e;--win:#3ecf8e;--loss:#ff6b5e;--pend:#f0b429}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1b2027;--tx:#eef1f5;--mute:#98a2b3;--line:#2b323c;--acc:#3ecf8e;--win:#3ecf8e;--loss:#ff6b5e;--pend:#f0b429}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
input:disabled{opacity:.55;cursor:not-allowed}
.auto{padding:10px;border:1px dashed var(--line);border-radius:10px;font-size:16px;font-weight:600;user-select:none;-webkit-user-select:none;min-height:44px;background:var(--bg);color:var(--mute)}
button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.w{color:var(--win);border-color:var(--win)}button.l{color:var(--loss);border-color:var(--loss)}
button:disabled{opacity:.4;cursor:not-allowed}
.sp{flex:1}
#days{max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.day{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.day.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day.done{opacity:.75}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.won{color:var(--win)}.lost{color:var(--loss)}.pending{color:var(--pend)}.wait{color:var(--mute)}
.stat{text-align:center}.stat b{display:block;font-size:20px}
.lock{font-size:12px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>🎯 Bet Rollover Planner</h1>

<div class="card">
  <div class="row" style="margin-bottom:10px"><b class="sp">Setup</b><span class="lock" id="lockLbl"></span></div>
  <div class="grid">
    <div><label>Starting capital</label><input id="iCap" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label>Odds per day (decimal)</label><input id="iOdds" type="number" inputmode="decimal" min="1.01" step="any"></div>
    <div><label>Number of days</label><input id="iDays" type="number" inputmode="numeric" min="1" step="1"></div>
    <div><label>Expected amount (auto)</label><div id="iTarget" class="auto"></div></div>
  </div>
  <div class="row" style="margin-top:10px">
    <label style="margin:0">Currency</label><input id="iCur" maxlength="3" style="width:64px">
    <span class="sp"></span>
    <button class="l" id="resetBtn" onclick="resetAll()">Reset</button>
    <button class="p" id="applyBtn" onclick="applySettings()">Apply</button>
  </div>
  <div class="mute lost" id="msg" style="margin-top:8px"></div>
  <div class="mute" style="margin-top:8px">Expected amount = capital × odds<sup>days</sup>. After you apply, the fields lock until you tap Reset, finish the rollover, or lose a day.</div>
</div>

<div class="card">
  <div class="mute" id="attLbl"></div>
  <div class="big" id="bal"></div>
  <div class="mute" id="balSub"></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="row mute"><span id="prog"></span><span class="sp"></span><span id="goal"></span></div>
  <div class="grid" style="margin-top:12px">
    <div class="stat"><b id="stAtt">1</b><span class="mute">Attempt</span></div>
    <div class="stat"><b id="stBest">0</b><span class="mute">Best streak (days)</span></div>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:8px"><span class="mute sp" id="rangeLbl">Daily schedule</span>
    <button id="prevBtn" onclick="go(-1)">‹</button><button id="nextBtn" onclick="go(1)">›</button></div>
  <div id="days"></div>
</div>

<div class="card">
  <div class="mute" style="margin-bottom:6px">Attempt history</div>
  <div id="hist"></div>
  <div class="row" style="margin-top:10px"><button onclick="undo()">Undo last day</button></div>
</div>
</main>

<script>
var KEY="betRolloverPlannerV2",PER=10;
var S={cap:10,odds:1.5,days:5,cur:"$",locked:false,attempt:1,won:0,history:[],best:0,page:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p.won==="number")S=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function r2(n){return Math.round(n*100)/100;}
function fmt(n){return S.cur+r2(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function $(id){return document.getElementById(id);}
function pages(){return Math.max(1,Math.ceil(S.days/PER));}
function complete(){return S.locked&&S.won>=S.days;}

function readDraft(){
  var c=parseFloat($("iCap").value),o=parseFloat($("iOdds").value),d=parseInt($("iDays").value,10);
  if(c>0)S.cap=c;if(o>1)S.odds=o;if(d>=1)S.days=d;
  S.cur=$("iCur").value||"$";
  S.page=Math.min(S.page,pages()-1);
}
function onDraft(){if(S.locked)return;readDraft();S.won=0;save();render();}
["iCap","iOdds","iDays","iCur"].forEach(function(id){$(id).addEventListener("input",onDraft);});

function render(){
  var ids={iCap:S.cap,iOdds:S.odds,iDays:S.days,iCur:S.cur};
  for(var k in ids){var el=$(k);el.disabled=S.locked;if(document.activeElement!==el)el.value=ids[k];}
  $("applyBtn").disabled=S.locked;
  $("lockLbl").textContent=S.locked?"🔒 Locked":"✏️ Editable";
  $("lockLbl").className="lock "+(S.locked?"won":"pending");
  var tgt=S.cap*Math.pow(S.odds,S.days),won=S.locked?S.won:0,done=complete();
  $("iTarget").textContent=fmt(tgt);

  $("attLbl").textContent="Attempt #"+S.attempt+(done?" · completed 🎉":(S.locked?" · Day "+(won+1)+" of "+S.days:" · Not started"));
  $("bal").textContent=fmt(S.cap*Math.pow(S.odds,won));
  $("balSub").textContent=done?"Target reached":(S.locked?"Current balance (today's stake)":"Tap Apply to begin");
  $("fill").style.width=Math.min(100,won/S.days*100)+"%";
  $("prog").textContent=won+" / "+S.days+" days won";
  $("goal").textContent="Expected "+fmt(tgt);
  $("stAtt").textContent=S.attempt;
  $("stBest").textContent=Math.max(S.best,won);

  var start=S.page*PER,end=Math.min(S.days,start+PER),h="";
  $("rangeLbl").textContent="Days "+(start+1)+"–"+end+" of "+S.days+(pages()>1?" · Page "+(S.page+1)+"/"+pages():"");
  $("prevBtn").disabled=S.page<=0;$("nextBtn").disabled=S.page>=pages()-1;
  $("prevBtn").style.display=$("nextBtn").style.display=pages()>1?"":"none";
  for(var i=start+1;i<=end;i++){
    var stake=S.cap*Math.pow(S.odds,i-1),ret=stake*S.odds,cls="",tag,act="";
    if(S.locked&&i<=won){cls="done";tag='<span class="tag won">won</span>';}
    else if(S.locked&&i===won+1&&!done){
      cls="cur";tag='<span class="tag pending">today</span>';
      act='<div class="row" style="margin-top:10px"><button class="w sp" onclick="mark(true)">✓ Won</button><button class="l sp" onclick="mark(false)">✗ Lost</button></div>';
    }else tag='<span class="tag wait">upcoming</span>';
    h+='<div class="day '+cls+'"><div class="row"><b>Day '+i+'</b><span class="mute sp">Stake '+fmt(stake)+' → '+fmt(ret)+'</span>'+tag+'</div>'+act+'</div>';
  }
  if(done)h+='<div class="row"><button class="p sp" onclick="newRollover()">Start new rollover</button></div>';
  $("days").innerHTML=h;

  var rows="";
  if(!done){
    var dots="";if(S.days<=200){for(var d=1;d<=S.days;d++)dots+=(d<=won?"●":"○");}
    rows+='<div class="row" style="padding:8px 0"><b>#'+S.attempt+'</b><span class="mute sp" style="word-break:break-all">'+dots+' '+won+'/'+S.days+' days</span><span class="tag '+(S.locked?"pending":"wait")+'">'+(S.locked?"in progress":"not started")+'</span></div>';
  }
  rows+=S.history.slice().reverse().map(function(a){
    return '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><b>#'+a.n+'</b><span class="mute sp">'+(a.ok?"Completed all "+a.days+" days":"Lost on day "+a.lostDay+" of "+a.days+" ("+a.wins+" won)")+'</span><span class="tag '+(a.ok?"won":"lost")+'">'+(a.ok?"won":"lost")+'</span></div>';
  }).join("");
  $("hist").innerHTML=rows;
}

var resetArmed=false,resetTimer;
function disarm(){resetArmed=false;var b=$("resetBtn");if(b)b.textContent="Reset";}
function go(n){S.page=Math.max(0,Math.min(pages()-1,S.page+n));render();}
function applySettings(){
  var c=parseFloat($("iCap").value),o=parseFloat($("iOdds").value),d=parseInt($("iDays").value,10);
  if(!(c>0)||!(o>1)||!(d>=1)){$("msg").textContent="Enter capital > 0, odds > 1 and at least 1 day.";return;}
  S.cap=c;S.odds=o;S.days=d;S.cur=$("iCur").value||"$";
  $("msg").textContent="";S.locked=true;S.won=0;S.page=0;save();render();
}
function mark(win){
  if(!S.locked||S.won>=S.days)return;
  if(win){
    S.won++;
    if(S.won>=S.days){S.history.push({n:S.attempt,ok:true,days:S.days,wins:S.days});S.best=Math.max(S.best,S.days);}
    S.page=Math.floor(Math.min(S.won,S.days-1)/PER);
  }else{
    S.history.push({n:S.attempt,ok:false,lostDay:S.won+1,wins:S.won,days:S.days});
    S.best=Math.max(S.best,S.won);
    S.attempt++;S.won=0;S.locked=false;S.page=0;
  }
  save();render();
}
function newRollover(){S.attempt++;S.won=0;S.locked=false;S.page=0;save();render();}
function undo(){
  var last=S.history[S.history.length-1];
  if(S.locked&&S.won>0){
    if(complete()&&last&&last.ok)S.history.pop();
    S.won--;S.page=Math.floor(S.won/PER);save();render();return;
  }
  if(!S.locked&&last&&!last.ok&&S.attempt-1===last.n){
    S.history.pop();S.attempt=last.n;S.cap=S.cap;S.won=last.wins;S.days=last.days;S.locked=true;S.page=Math.floor(Math.min(S.won,S.days-1)/PER);save();render();
  }
}
function resetAll(){
  if(!resetArmed){resetArmed=true;$("resetBtn").textContent="Tap again to confirm";clearTimeout(resetTimer);resetTimer=setTimeout(disarm,4000);return;}
  disarm();$("msg").textContent="";
  S.locked=false;S.won=0;S.attempt=1;S.history=[];S.best=0;S.page=0;save();render();
}
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
